<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>StageFreight – Audience Facing Stage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
        html,body { margin:0; height:100%; background:#000; overflow:hidden; }
        .hint { position:fixed; left:12px; bottom:12px; color:#bbb; font:12px/1.4 system-ui; opacity:.8 }
    </style>
    </head>

    <body>
    <a-scene
    renderer="antialias: true"
    vr-mode-ui="enabled: true"
    webxr="optionalFeatures: local-floor, bounded-floor, hand-tracking"
    background="color: #101014">

    <!-- ASSETS -->
    <a-assets timeout="30000">
        <a-asset-item id="auditoriumModel" src="auditorium.glb"></a-asset-item>
        <a-asset-item id="caleb" src="caleb.glb"></a-asset-item>
        <a-asset-item id="vika" src="vika_cad.glb"></a-asset-item>
    </a-assets>

    <!-- LIGHTING -->
    <a-entity light="type: ambient; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; intensity: 1.3" position="2 6 2"></a-entity>
    <a-entity light="type: point; intensity: 0.8; distance: 35" position="0 5 5"></a-entity>

    <!-- CAMERA -->
    <a-entity id="player" position="0 1.6 -4" elevate-controls="speed:3">
        <a-entity camera look-controls wasd-controls="acceleration:15"></a-entity>
    </a-entity>

    <!-- FLOOR -->
    <a-plane rotation="-90 0 0" width="120" height="120" color="#1b1b1b"></a-plane>

    <!-- AUDITORIUM -->
    <a-entity id="auditorium" gltf-model="#auditoriumModel"></a-entity>

    <!-- AUDIENCE -->
    <a-entity id="audience-group"></a-entity>
    </a-scene>

    <div class="hint">Click canvas to focus • WASD move • Q down / E up</div>

    <script>
    /* --- Elevator controls --- */
    AFRAME.registerComponent('elevate-controls', {
    schema: { speed: { default: 3 } },
    init() {
        this.up = this.down = false;
        window.addEventListener('keydown', e => {
        if (e.key.toLowerCase() === 'e') this.up = true;
        if (e.key.toLowerCase() === 'q') this.down = true;
        });
        window.addEventListener('keyup', e => {
        if (e.key.toLowerCase() === 'e') this.up = false;
        if (e.key.toLowerCase() === 'q') this.down = false;
        });
    },
    tick(time, dt) {
        const dy = (this.up ? 1 : 0) - (this.down ? 1 : 0);
        if (!dy) return;
        this.el.object3D.position.y += dy * (this.data.speed * dt / 1000);
    }
    });

    /* --- Load auditorium + spawn audience --- */
    const auditorium = document.querySelector('#auditorium');
    auditorium.addEventListener('model-loaded', () => {
    const obj = auditorium.getObject3D('mesh');
    if (!obj) return;

    // Remove any dark planes/screens that may appear behind the seats
    obj.traverse(node => {
        if (node.isMesh && node.material && node.material.color) {
        const name = node.name.toLowerCase();
        const color = node.material.color;
        if (
            (color.r < 0.05 && color.g < 0.05 && color.b < 0.05) ||
            name.includes('plane') || name.includes('shadow') || name.includes('screen') || name.includes('panel')
        ) node.visible = false;
        }
    });

    const box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    obj.position.sub(center);
    obj.position.y += size.y / 2;
    const scale = 10 / Math.max(size.x, size.y, size.z);
    auditorium.setAttribute('scale', `${scale} ${scale} ${scale}`);

    spawnAudience();
    });

    /* --- Grid: 10 rows × 13 columns (denser audience) --- */
    const seatPositions = [];
    for (let r = 0; r < 10; r++) {
    for (let c = 0; c < 13; c++) {
        const x = (c - 6) * 0.5;      // tighter left-right spacing
        const z = 0.3 - r * 1.05;     // slightly closer front-to-back
        const y = 0.15 + r * 0.1;     // small upward slope by row
        seatPositions.push([x, y, z]);
    }
    }

    /* --- Spawn alternating Caleb & Vika, facing stage (user) --- */
    function spawnAudience() {
    const group = document.querySelector('#audience-group');
    const models = ['#caleb', '#vika'];

    seatPositions.forEach((pos, i) => {
        const entity = document.createElement('a-entity');
        const model = models[i % models.length];
        entity.setAttribute('gltf-model', model);

        const [x, y, z] = pos;
        const randScale = 0.93 + Math.random() * 0.07;
        entity.setAttribute('position', `${x} ${y} ${z}`);
        entity.setAttribute('scale', `${randScale} ${randScale} ${randScale}`);
        entity.setAttribute('rotation', `0 0 0`);

        entity.addEventListener('model-loaded', e => {
        const mesh = e.detail.model;
        mesh.traverse(n => {
            if (n.isMesh && n.material && n.material.color) {
            const col = n.material.color;
            const name = n.name.toLowerCase();
            if (
                (col.r < 0.05 && col.g < 0.05 && col.b < 0.05) ||
                name.includes('back') || name.includes('shadow') || name.includes('plane')
            ) n.visible = false;
            }
        });
        });

        entity.setAttribute('animation', {
        property: 'rotation',
        dir: 'alternate',
        dur: 4500 + Math.random() * 1500,
        easing: 'easeInOutSine',
        loop: true,
        to: `0 ${(Math.random() * 3 - 1.5)} 0`
        });

        group.appendChild(entity);
    });

    console.log(`✅ Audience now facing toward you (denser rows, no black screen).`);
}
</script>
</body>
</html>
