<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SpeakSpaceVR – Audience Facing Stage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    html,body { margin:0; height:100%; background:#000; overflow:hidden; }
    .hint { position:fixed; left:12px; bottom:12px; color:#bbb; font:12px/1.4 system-ui; opacity:.8 }
    .hud  { position:fixed; right:12px; top:12px; color:#9ad; font:12px/1.3 system-ui; background:rgba(0,0,0,.4); padding:8px 10px; border:1px solid #234; border-radius:8px }
  </style>
</head>
<body>
<a-scene
  renderer="antialias: true"
  vr-mode-ui="enabled: true"
  webxr="optionalFeatures: local-floor, bounded-floor, hand-tracking"
  background="color: #101014">

  <!-- ASSETS (cache-busted) -->
  <a-assets timeout="30000">
    <a-asset-item id="auditoriumModel" src="auditorium.glb?v=9"></a-asset-item>
    <a-asset-item id="caleb" src="caleb.glb?v=9"></a-asset-item>
  </a-assets>

  <!-- LIGHTING -->
  <a-entity light="type: ambient; intensity: 1.2"></a-entity>
  <a-entity light="type: directional; intensity: 1.3" position="2 6 2"></a-entity>
  <a-entity light="type: point; intensity: 0.8; distance: 35" position="0 5 5"></a-entity>

  <!-- CAMERA / RIG (WASD + Q/E) -->
  <a-entity id="player" position="0 1.6 -4" elevate-controls="speed:3">
    <a-entity id="cam" camera look-controls wasd-controls="acceleration:15"></a-entity>
  </a-entity>

  <!-- FLOOR -->
  <a-plane rotation="-90 0 0" width="120" height="120" color="#1b1b1b"></a-plane>

  <!-- AUDITORIUM + AUDIENCE -->
  <a-entity id="auditorium" gltf-model="#auditoriumModel"></a-entity>
  <a-entity id="audience-group"></a-entity>

  <!-- GAZE ZONES -->
  <a-entity gaze-zone="name:front-left"
            geometry="primitive: box; width:12; height:5; depth:12"
            material="transparent:true; opacity:0"
            position="-6 2 -6"></a-entity>
  <a-entity gaze-zone="name:front-center"
            geometry="primitive: box; width:12; height:5; depth:12"
            material="transparent:true; opacity:0"
            position="0 2 -6"></a-entity>
  <a-entity gaze-zone="name:front-right"
            geometry="primitive: box; width:12; height:5; depth:12"
            material="transparent:true; opacity:0"
            position="6 2 -6"></a-entity>
  <a-entity gaze-zone="name:back"
            geometry="primitive: box; width:36; height:6; depth:14"
            material="transparent:true; opacity:0"
            position="0 3 -16"></a-entity>
</a-scene>

<div class="hint">Click canvas • WASD move • Q down / E up • Press <b>G</b> to toggle zone debug</div>
<div class="hud" id="hud">Gaze: —</div>

<script>
/* ---------- Q/E vertical controls ---------- */
AFRAME.registerComponent('elevate-controls', {
  schema: { speed: { default: 3 } },
  init(){ this.up=this.down=false;
    addEventListener('keydown',e=>{const k=e.key.toLowerCase(); if(k==='e')this.up=true; if(k==='q')this.down=true;});
    addEventListener('keyup',e=>{const k=e.key.toLowerCase(); if(k==='e')this.up=false; if(k==='q')this.down=false;});
  },
  tick(t,dt){ const dy=(this.up?1:0)-(this.down?1:0); if(!dy) return; this.el.object3D.position.y += dy*(this.data.speed*dt/1000); }
});

/* ---------- Reliable idle sway (no animation component needed) ---------- */
AFRAME.registerComponent('idle-sway', {
  schema:{ ampYaw:{default:4}, ampRoll:{default:1.2}, ampBob:{default:0.03}, speed:{default:1.0} },
  init(){
    const p=this.el.getAttribute('position'), r=this.el.getAttribute('rotation');
    this.basePos={x:p.x,y:p.y,z:p.z}; this.baseRot={x:r.x,y:r.y,z:r.z};
    this.phase=Math.random()*Math.PI*2;
  },
  tick(time){
    const t=(time/1000)*this.data.speed + this.phase;
    const yaw = Math.sin(t*0.6)*this.data.ampYaw;         // left-right
    const roll= Math.sin(t*0.9+0.5)*this.data.ampRoll;    // shoulder tilt
    const bob = Math.sin(t*0.7+1.0)*this.data.ampBob;     // subtle vertical
    this.el.setAttribute('rotation', `${this.baseRot.x} ${this.baseRot.y + yaw} ${this.baseRot.z + roll}`);
    this.el.setAttribute('position', `${this.basePos.x} ${this.basePos.y + bob} ${this.basePos.z}`);
  }
});

/* ---------- Gaze zones + metrics ---------- */
AFRAME.registerComponent('gaze-zone', { schema:{ name:{default:'zone'} }, init(){ this.el.object3D.userData.gazeZoneName=this.data.name; } });

AFRAME.registerComponent('gaze-metrics', {
  schema:{ reportMs:{default:5000} },
  init(){
    this.dir=new THREE.Vector3(); this.pos=new THREE.Vector3();
    this.ray=new THREE.Raycaster(); this.acc={}; this._last=performance.now();
    this.zoneObjs=[...document.querySelectorAll('[gaze-zone]')].map(el=>el.object3D);
    this.hud=document.getElementById('hud');
    addEventListener('keydown', e=>{
      if(e.key.toLowerCase()==='g'){
        const show = !(this._dbg||false); this._dbg=show;
        document.querySelectorAll('[gaze-zone]').forEach(el=>{
          const m=el.getObject3D('mesh'); if(m){ m.traverse(n=>{ if(n.material){ n.material.transparent=true; n.material.opacity=show?0.12:0; } }); }
        });
      }
    });
    this._timer=setInterval(()=>this.report(), this.data.reportMs);
  },
  remove(){ clearInterval(this._timer); },
  tick(){
    const camEl=document.getElementById('cam'); const scene=this.el.sceneEl;
    if(!camEl||!scene.camera||!this.zoneObjs.length) return;
    camEl.object3D.getWorldPosition(this.pos);
    scene.camera.getWorldDirection(this.dir);
    this.ray.set(this.pos, this.dir);
    const hits=this.ray.intersectObjects(this.zoneObjs,true);
    const now=performance.now(); const dms=now - this._last; this._last=now;
    let zone='none';
    if(hits.length){
      let o=hits[0].object; while(o && !o.userData.gazeZoneName) o=o.parent;
      if(o && o.userData.gazeZoneName) zone=o.userData.gazeZoneName;
    }
    this.acc[zone]=(this.acc[zone]||0)+dms;
    if(this.hud) this.hud.textContent=`Gaze: ${zone} • ${(this.acc[zone]/1000).toFixed(1)}s`;
  },
  report(){
    const total = Object.values(this.acc).reduce((a,b)=>a+b,0)||1;
    const pct = Object.fromEntries(Object.entries(this.acc).map(([k,v])=>[k, Math.round(100*v/total)]));
    console.log('🧭 Gaze summary (last 5s):', pct);
    this.acc={};
  }
});

/* ---------- Load auditorium, normalize, then spawn audience ---------- */
const auditoriumEl=document.querySelector('#auditorium');
auditoriumEl.addEventListener('model-loaded', ()=>{
  const obj=auditoriumEl.getObject3D('mesh'); if(!obj) return;

  // Hide stray dark planes/screens
  obj.traverse(n=>{
    if(n.isMesh && n.material && n.material.color){
      const c=n.material.color, name=(n.name||'').toLowerCase();
      if((c.r<0.05&&c.g<0.05&&c.b<0.05)||name.includes('plane')||name.includes('shadow')||name.includes('screen')||name.includes('panel')){
        n.visible=false;
      }
    }
  });

  // Fit/center
  const box=new THREE.Box3().setFromObject(obj), size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
  obj.position.sub(center); obj.position.y += size.y/2;
  const scale=10/Math.max(size.x,size.y,size.z); auditoriumEl.setAttribute('scale', `${scale} ${scale} ${scale}`);

  spawnAudience();
  startDistractionSounds();
  document.querySelector('a-scene').setAttribute('gaze-metrics','');
});

/* ---------- Seating grid (10 x 13 = 130) ---------- */
const seatPositions=[];
for(let r=0;r<10;r++){ for(let c=0;c<13;c++){
  const x=(c-6)*0.5, z=0.3 - r*1.05, y=0.15 + r*0.1; seatPositions.push([x,y,z]); }}

/* ---------- Create a person (Caleb) with optional idle sway ---------- */
function createPerson(pos){
  const wrapper=document.createElement('a-entity');
  const [x,y,z]=pos; wrapper.setAttribute('position',`${x} ${y} ${z}`);
  const s=0.93 + Math.random()*0.07; wrapper.setAttribute('scale',`${s} ${s} ${s}`);
  wrapper.setAttribute('rotation','0 0 0');

  const person=document.createElement('a-entity');
  person.setAttribute('gltf-model','#caleb');
  person.addEventListener('model-loaded', e=>{
    const mesh=e.detail.model;
    mesh.traverse(n=>{
      if(n.isMesh && n.material && n.material.color){
        const col=n.material.color; const name=(n.name||'').toLowerCase();
        if((col.r<0.05&&col.g<0.05&&col.b<0.05)||name.includes('back')||name.includes('shadow')||name.includes('plane')){
          n.visible=false;
        }
      }
    });
  });
  wrapper.appendChild(person);

  // Attach our reliable sway to ~70% of people
  if(Math.random()<0.7){
    const ampYaw = 2 + Math.random()*4;     // 2–6°
    const ampRoll= 0.5 + Math.random()*1.5; // 0.5–2°
    const ampBob = 0.02 + Math.random()*0.03; // 2–5 cm
    const speed  = 0.9 + Math.random()*0.5; // 0.9–1.4×
    wrapper.setAttribute('idle-sway', `ampYaw:${ampYaw}; ampRoll:${ampRoll}; ampBob:${ampBob}; speed:${speed}`);
  }

  return wrapper;
}

/* ---------- Spawn audience ---------- */
function spawnAudience(){
  const group=document.querySelector('#audience-group'); group.innerHTML='';
  seatPositions.forEach(p=> group.appendChild(createPerson(p)));
  console.log(`✅ Spawned audience: ${seatPositions.length} Calebs (~70% swaying).`);
}

/* ---------- Randomized distraction sounds (no repeats, ≥5s gap) ---------- */
function startDistractionSounds(){
  const srcs=['cough-cough-103526.mp3','heh-interesting-82042.mp3','new-notification-09-352705.mp3','sneeze-429801.mp3'];
  const clips=srcs.map(s=>{ const a=new Audio(s); a.volume=0.35; a.preload='auto'; return a; });
  const MIN=5000, MAX=15000; let last=-1, armed=false;
  function pick(n,prev){ if(n<=1) return 0; let i=Math.floor(Math.random()*n); if(i===prev) i=(i+1+Math.floor(Math.random()*(n-1)))%n; return i; }
  function loop(){ const wait=MIN + Math.floor(Math.random()*(MAX-MIN));
    setTimeout(()=>{ const i=pick(clips.length,last); last=i; const a=clips[i]; try{ a.currentTime=0; a.play().catch(()=>{});}catch{} loop(); }, wait); }
  function arm(){ if(armed) return; armed=true; clips.forEach(a=>{ a.play().then(()=>a.pause()).catch(()=>{}); }); loop(); removeEventListener('click',arm); removeEventListener('keydown',arm); removeEventListener('touchstart',arm); }
  addEventListener('click',arm); addEventListener('keydown',arm); addEventListener('touchstart',arm);
}
</script>
</body>
</html>
