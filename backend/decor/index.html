<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Classroom • Spidey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    html,body{margin:0;height:100%;background:#0b0b0f}
    #hud{position:fixed;left:10px;bottom:10px;color:#cbd5e1;font:12px/1.4 system-ui, sans-serif;opacity:.9}
    #hud kbd{background:#1f2937;border:1px solid #334155;border-radius:4px;padding:2px 5px;margin:0 2px}
  </style>
</head>
<body>
  <a-scene renderer="antialias:true" background="color:#0f1016" shadow="type:pcfsoft">
    <!-- Lights -->
    <a-entity light="type:ambient; intensity:1.0; color:#fff"></a-entity>
    <a-entity light="type:directional; intensity:1.1" position="2 5 3"></a-entity>

    <!-- Camera rig -->
    <a-entity id="rig" position="0 1.6 8" elevate-controls>
      <a-entity id="cam" camera wasd-controls="acceleration:30" look-controls></a-entity>
    </a-entity>

    <!-- Classroom GLB  (make sure this filename matches your file) -->
    <a-entity id="room"
              gltf-model="url(japanese_classroom.glb)"
              position="0 0 0"
              rotation="0 180 0"
              scale="0.6 0.6 0.6"
              shadow="receive:true">
    </a-entity>

    <!-- Spidey -->
    <a-entity id="spidey"
              gltf-model="url(spider-man_mcu.glb)"
              position="0 0 -1.5"
              rotation="0 180 0"
              scale="0.04 0.04 0.04"
              shadow="cast:true">
    </a-entity>

    <!-- Tiny marker to show ray hits -->
    <a-sphere id="hitDot" radius="0.03" color="#10b981" visible="false"></a-sphere>
  </a-scene>

  <div id="hud">
    Click canvas to focus → <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move • <kbd>Q</kbd>/<kbd>E</kbd> down/up •
    Spidey size <kbd>[</kbd> smaller <kbd>]</kbd> bigger <kbd>1</kbd> fit ~1.75 m •
    <b>Click</b> a chair top to place Spidey there
  </div>

  <script>
    // --- Q/E vertical control on rig ---
    AFRAME.registerComponent('elevate-controls',{
      schema:{speed:{default:3}},
      init(){ this.up=false; this.down=false;
        addEventListener('keydown',e=>{ if(e.key==='e'||e.key==='E') this.up=true; if(e.key==='q'||e.key==='Q') this.down=true; });
        addEventListener('keyup',  e=>{ if(e.key==='e'||e.key==='E') this.up=false; if(e.key==='q'||e.key==='Q') this.down=false; });
      },
      tick(t,dt){
        const dir=(this.up?1:0)-(this.down?1:0);
        if(!dir) return;
        this.el.object3D.position.y += dir * this.data.speed * (dt/1000);
      }
    });

    // --- helpers: scale + fit-to-height ---
    function setUniformScale(el, s){ el.object3D.scale.set(s,s,s); }
    function fitHeight(el, meters){
      const obj = el.getObject3D('mesh'); if(!obj) return;
      const box = new THREE.Box3().setFromObject(obj);
      const size = new THREE.Vector3(); const min = new THREE.Vector3();
      box.getSize(size); box.getMin(min);
      const worldH = size.y * (el.object3D.scale.y||1); if(worldH<=0) return;
      const factor = meters / worldH;
      el.object3D.scale.multiplyScalar(factor);
      // lift to floor
      const lift = (-min.y) * el.object3D.scale.y;
      el.object3D.position.y += lift;
    }

    const scene  = document.querySelector('a-scene');
    const camEl  = document.getElementById('cam');
    const roomEl = document.getElementById('room');
    const spidey = document.getElementById('spidey');
    const hitDot = document.getElementById('hitDot');

    // Resize hotkeys
    addEventListener('keydown', (e)=>{
      if(e.repeat) return;
      if(e.key==='[') setUniformScale(spidey, spidey.object3D.scale.x * 0.9);
      if(e.key===']') setUniformScale(spidey, spidey.object3D.scale.x / 0.9);
      if(e.key==='1') fitHeight(spidey, 1.75);
    });

    // Fit Spidey once model is ready
    spidey.addEventListener('model-loaded', ()=>{ fitHeight(spidey, 1.75); });

    // Enable click-to-place ONLY after classroom is ready
    roomEl.addEventListener('model-loaded', ()=>{
      console.log('[room] model loaded, click-to-place enabled');
      const camera = camEl.getObject3D('camera');

      scene.canvas.addEventListener('click', ()=>{
        // Ray from camera center forward
        camera.updateMatrixWorld();
        const origin = new THREE.Vector3();
        const dir    = new THREE.Vector3(0,0,-1);
        camera.getWorldPosition(origin);
        camera.getWorldDirection(dir);

        const rc = new THREE.Raycaster(origin, dir.normalize(), 0.01, 50);
        const roomMesh = roomEl.getObject3D('mesh');
        if(!roomMesh){ console.warn('room mesh missing'); return; }

        const hits = rc.intersectObject(roomMesh, true);
        if(hits.length === 0){ console.log('No hit. Aim at a chair/desk and click.'); return; }

        // Use first hit; nudge Y upward to seat level
        const p = hits[0].point.clone();
        const seatLift = 0.45; // tweak this value for your seats
        spidey.object3D.position.set(p.x, p.y + seatLift, p.z);

        // Face the same direction as camera
        const yaw = Math.atan2(dir.x, dir.z) * THREE.MathUtils.RAD2DEG;
        spidey.setAttribute('rotation', `0 ${yaw+180} 0`);

        // Show a small dot where we hit (for debugging)
        hitDot.object3D.position.copy(p);
        hitDot.setAttribute('visible', true);
        setTimeout(()=>hitDot.setAttribute('visible', false), 800);
      });
    });

    // Fallback logging to help if nothing happens
    scene.addEventListener('loaded', ()=>{
      console.log('[scene] loaded');
      if(!scene.canvas){
        // Canvas may not be ready right away
        scene.addEventListener('render-target-loaded', ()=>console.log('[scene] render target ready'));
      }
    });
  </script>
</body>
</html>
