<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StageFreight XR Audio Simulation</title>

  <!-- A-Frame for WebXR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: system-ui; }
    .hud {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 8px;
      z-index: 10;
    }
    .hud button {
      margin-right: 8px;
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      background: #16a34a;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="hud">
    <button id="startBtn">Start Simulation</button>
    <button id="stopBtn">Stop</button>
  </div>

  <a-scene>
    <!-- Simple floor and light -->
    <a-plane rotation="-90 0 0" width="10" height="10" color="#111"></a-plane>
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: point; intensity: 1" position="0 3 2"></a-entity>
    <a-camera position="0 1.6 2"></a-camera>

    <!-- Audio sources -->
    <a-entity id="cough"  sound="src: url(cough.mp3); autoplay: false; volume: 1.0"></a-entity>
    <a-entity id="sneeze" sound="src: url(sneeze.mp3); autoplay: false; volume: 1.0"></a-entity>
    <a-entity id="phone"  sound="src: url(bell-notification-430402.mp3); autoplay: false; volume: 1.0"></a-entity>
  </a-scene>

  <script>
    const sounds = [
      document.getElementById('cough'),
      document.getElementById('sneeze'),
      document.getElementById('phone')
    ];
    let timer = null;

    function playRandomSound() {
      // pick a random sound entity
      const randomSound = sounds[Math.floor(Math.random() * sounds.length)];
      if (randomSound.components.sound) {
        randomSound.components.sound.playSound();
        console.log('Played:', randomSound.id);
      }
      // schedule next one at random interval (6–12 seconds)
      const nextDelay = Math.random() * 6000 + 6000;
      timer = setTimeout(playRandomSound, nextDelay);
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      if (timer) clearTimeout(timer);
      playRandomSound();
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
      if (timer) clearTimeout(timer);
      timer = null;
    });
  </script>
</body>
</html>
