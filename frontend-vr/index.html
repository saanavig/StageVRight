<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hello WebXR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene></a-scene>
      <!-- Temporary HUD overlay for debugging (press 'H' to toggle) -->
      <div id="hud-overlay" style="position:fixed;top:10px;left:10px;background:rgba(0,0,0,0.7);color:#fff;padding:8px 16px;border-radius:8px;font-family:monospace;z-index:1000;pointer-events:none;">
        <div><b>Camera Position:</b> <span id="hud-pos">-</span></div>
        <div><b>Camera Rotation:</b> <span id="hud-rot">-</span></div>
        <div style="font-size:0.8em;opacity:0.7;">(Press 'H' to hide/show HUD)</div>
      </div>
    <script type="module" src="/src/scene.js"></script>
  </body>
</html>
